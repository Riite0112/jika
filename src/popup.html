<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>時価(Jika)</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <p class="eyebrow">時価(Jika)</p>
          <h1>労働時間で見る価格</h1>
        </div>
        <label class="switch" title="拡張機能の表示を切り替え">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <section class="panel">
        <label class="field">
          <span>時給</span>
          <div class="money-input">
            <input id="hourlyWage" type="number" min="1" step="1" inputmode="numeric">
            <span>円</span>
          </div>
        </label>
        <label class="field">
          <span>最低表示金額</span>
          <div class="money-input">
            <input id="minPrice" type="number" min="0" step="100" inputmode="numeric">
            <span>円</span>
          </div>
        </label>
      </section>

      <section class="panel">
        <div class="section-title">月収から計算</div>
        <label class="field">
          <span>月収</span>
          <div class="money-input">
            <input id="monthlyIncome" type="number" min="0" step="1000" inputmode="numeric">
            <span>円</span>
          </div>
        </label>
        <label class="field">
          <span>月間労働時間</span>
          <div class="money-input">
            <input id="monthlyHours" type="number" min="1" step="1" inputmode="decimal">
            <span>時間</span>
          </div>
        </label>
        <label class="check-row">
          <input id="netIncome" type="checkbox">
          <span>手取り換算で計算</span>
        </label>
      </section>

      <button id="disableSite" class="site-button" type="button">このサイトでは無効</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
